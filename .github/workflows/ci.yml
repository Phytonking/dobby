name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - run: python scripts/check_secrets.py
      - run: ruff check bot scripts tests
      - run: ruff format --check bot scripts tests
      - run: python -m pytest -q
      - run: docker build -t calendar-bot:test .
