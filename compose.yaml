name: dobby

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dobby
      POSTGRES_USER: dobby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dobby"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  migrate:
    build:
      context: .
      target: migrate
    command: alembic -c migrations/alembic.ini upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://dobby:${POSTGRES_PASSWORD}@postgres:5432/dobby
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      target: runtime
    image: dobby-bot:local
    pull_policy: never
    user: "${DOBBY_UID:-10001}:${DOBBY_GID:-10001}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      DATABASE_URL: postgresql+asyncpg://dobby:${POSTGRES_PASSWORD}@postgres:5432/dobby
      DISCORD_TOKEN: ${DISCORD_TOKEN:?}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY_BACKUP: ${AI_API_KEY_BACKUP:-}
      # No default: preserve absent (legacy fallback) versus explicitly empty (disabled).
      AI_MODEL_BACKUP:
      LOCAL_MODEL: ${LOCAL_MODEL:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8192}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-40}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:?}
      # Tools returning file attachments write a cache; the root filesystem is read-only.
      COMPOSIO_CACHE_DIR: /tmp/.composio
      COMPOSIO_ENTITY_ID: ${COMPOSIO_ENTITY_ID:-dobby}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      NOTION_PARENT_PAGE_ID: ${NOTION_PARENT_PAGE_ID:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_MODEL_BACKUP: ${GEMINI_MODEL_BACKUP-gemini-3.1-flash-lite}
      TEAM_TIMEZONE: ${TEAM_TIMEZONE:-America/Los_Angeles}
      CONTEXT_MESSAGE_LIMIT: ${CONTEXT_MESSAGE_LIMIT:-50}
      ALLOWED_ROLE_IDS: ${ALLOWED_ROLE_IDS:-}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      ALLOWED_CHANNEL_IDS: ${ALLOWED_CHANNEL_IDS:-}
      MENTION_CHANNEL_IDS: ${MENTION_CHANNEL_IDS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  dashboard:
    build:
      context: ./dashboard
    image: dobby-dashboard:local
    pull_policy: never
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dobby:${POSTGRES_PASSWORD}@postgres:5432/dobby
      SECRET_KEY: ${SECRET_KEY:?}
      AUTH_MODE: ${AUTH_MODE:-oauth}
      # Empty = loopback/RFC1918 only; add a VPN range here to let those clients log in.
      LOCAL_NETWORKS: ${LOCAL_NETWORKS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:?}
      COMPOSIO_ENTITY_ID: ${COMPOSIO_ENTITY_ID:-dobby}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      LOCAL_MODE: ${LOCAL_MODE:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle; rebuild this service after changing API_URL.
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
        LOCAL_MODE: ${LOCAL_MODE:-false}
    image: dobby-frontend:local
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
    depends_on:
      - dashboard
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  pgdata:
