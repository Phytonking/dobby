# Separate from the runtime: Google linking works before the token file exists.
name: dobby-auth
services:
  link-google:
    build: .
    image: dobby:local
    pull_policy: never
    user: "${DOBBY_UID:-10001}:${DOBBY_GID:-10001}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - type: bind
        source: ./secrets
        target: /app/secrets
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,mode=1777
    command: [python, scripts/link_google.py, --no-browser, --port, "8765", --bind, "0.0.0.0"]
